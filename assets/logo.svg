<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="48" fill="#0E1116"/>
  
  <!-- Subtle depth backing -->
  <rect x="32" y="32" width="192" height="192" rx="36" fill="#E8EDF2" opacity="0.04"/>
  
  <!-- Padlock body formed by the locking clapper mechanism -->
  <!-- Keyed slot / lock body - rounded geometric base -->
  <path d="M78 168 L78 148 Q78 136 90 136 L166 136 Q178 136 178 148 L178 168 Q178 184 162 184 L94 184 Q78 184 78 168 Z" fill="#E8EDF2"/>
  
  <!-- Inner keyhole slot cut into body -->
  <path d="M128 148 L128 162 Q128 168 122 168 L116 168 Q110 168 110 162 L110 152 Q110 148 114 148 Z" fill="#0E1116"/>
  <circle cx="128" cy="148" r="7" fill="#0E1116"/>
  
  <!-- Film clapper arm - upper arc locking into slot -->
  <!-- The clapper arm curves from the lock body upward and to the left -->
  <path d="M94 136 Q94 100 118 88 L140 80 Q152 76 160 84 L172 96 Q178 104 174 112 L162 120 Q158 124 152 122 L134 114 Q122 110 116 120 L112 136" fill="none" stroke="#FF5A3C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Clapper hinge detail -->
  <circle cx="166" cy="90" r="8" fill="#FFC24B"/>
  <circle cx="166" cy="90" r="4" fill="#0E1116"/>
  
  <!-- Clapper stripe pattern on arm (film clapper board stripes) -->
  <line x1="108" y1="132" x2="116" y2="118" stroke="#FFC24B" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="112" x2="128" y2="100" stroke="#FFC24B" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Keyed slot notch on right side of body -->
  <path d="M178 152 L188 152 L188 160 L178 160 Z" fill="#FFC24B"/>
  
  <!-- Small key teeth entering slot detail -->
  <rect x="182" y="154" width="4" height="4" fill="#0E1116"/>
  
  <!-- Subtle highlight on lock body top edge -->
  <path d="M90 138 L166 138 Q174 138 176 144" fill="none" stroke="#0E1116" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
  
  <!-- Cinematic frame corner ticks - off-center composition -->
  <path d="M48 48 L48 64 M48 48 L64 48" stroke="#FFC24B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M208 208 L208 192 M208 208 L192 208" stroke="#FFC24B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Tiny wordmark -->
  <text x="128" y="212" font-family="system-ui, sans-serif" font-size="9" fill="#E8EDF2" text-anchor="middle" opacity="0.35" letter-spacing="2">FILMORA</text>
</svg>
